[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-netkeeper"
version = "1.0.0"
description = "通用校园网自动认证与保活工具：零依赖、零常驻、零硬编码"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "baishuyue" }]
keywords = ["campus-network", "portal", "captive-portal", "drcom", "eportal", "srun", "802.1x"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/baishuyue/tools-for-specific-sites/tree/main/campus-netkeeper"
Issues = "https://github.com/baishuyue/tools-for-specific-sites/issues"

[project.scripts]
netkeeper = "netkeeper.cli:main"

[tool.setuptools]
packages = ["netkeeper", "netkeeper.adapters"]
